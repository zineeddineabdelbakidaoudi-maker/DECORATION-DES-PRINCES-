services:
  - type: web
    name: peintpro-cloud-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:api_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peintpro-db
          property: connectionString

databases:
  - name: peintpro-db
    databaseName: peintpro
    user: peintpro_user
